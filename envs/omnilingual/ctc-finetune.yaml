model:
  name: "@MODEL@"

dataset:
  name: "guanani_cv17"
  train_split: "train"
  valid_split: "dev"
  storage_mode: "MIXTURE_PARQUET"
  task_mode: "ASR"
  mixture_parquet_storage_config:
    dataset_summary_path: "@DATA@/language_distribution_0.tsv"
    beta_corpus: 0.5
    beta_language: 0.5
    fragment_loading:
      cache: True
  asr_task_config:
    min_audio_len: 16_000
    max_audio_len: 960_000
    max_num_elements: 1_920_000
    batch_shuffle_window: 1
    normalize_audio: true
    example_shuffle_window: 1000

tokenizer:
  name: "omniASR_tokenizer_written_v2"

optimizer:
  config:
    lr: 1e-05

trainer:
  freeze_encoder_for_n_steps: 0
  activation_checkpointing:
    mode: layerwise  # sin esto el CTC-1B no cabe en 24 GB
  mixed_precision:
    dtype: "torch.bfloat16"
  grad_accumulation:
    num_batches: 4

regime:
  num_steps: 5_000
  validate_every_n_steps: 500
  validate_after_n_steps: 500
  checkpoint_every_n_steps: 500
  checkpoint_after_n_steps: 500
  keep_last_n_checkpoints: 20
  publish_metrics_every_n_steps: 100

common:
  metric_recorders:
    tensorboard:
      enabled: false
